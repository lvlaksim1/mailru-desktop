name: Fetch Mail.ru APK package

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/fetch-mail-apk.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download package
        shell: bash
        env:
          DOWNLOAD_URL: 'https://srv6.apk.contact/storage/24/102/2102/split/594134/Mail.zip?apk_id=3823&e=1791387453&file_id=3526975&lang=en&premium_speed=0&s=BY2B-ODheCWQ9DKFXO2_dA&split_id=594134'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            --user-agent 'Mozilla/5.0' \
            "$DOWNLOAD_URL" \
            --output Mail_ru_15.107.0.148045_APKs.zip
          ls -lh Mail_ru_15.107.0.148045_APKs.zip
          test "$(stat -c%s Mail_ru_15.107.0.148045_APKs.zip)" -gt 100000000
          unzip -t Mail_ru_15.107.0.148045_APKs.zip >/dev/null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Mail_ru_15.107.0.148045_APKs
          path: Mail_ru_15.107.0.148045_APKs.zip
          compression-level: 0
          retention-days: 1
