name: Regenerate UI registry for theme update
on:
  push:
    branches: [fix/unified-primary-palette-metathread-unread-20261013]
    paths: [.github/workflows/regen-ui-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-primary-palette-metathread-unread-20261013
      - name: Regenerate and validate registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish generated registry to feature branch
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate registry for unified primary palette"
          git pull --rebase origin fix/unified-primary-palette-metathread-unread-20261013
          git push origin HEAD:fix/unified-primary-palette-metathread-unread-20261013
