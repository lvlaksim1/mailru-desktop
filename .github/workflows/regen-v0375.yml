name: Refresh feature UI registry
on:
  push:
    branches: [feature/v0.3.75-reply-preview-toast-settings]
    paths: [.github/workflows/regen-v0375.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.75-reply-preview-toast-settings
      - name: Generate and validate UI inventory
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate registry for v0.3.75"
          git pull --rebase origin feature/v0.3.75-reply-preview-toast-settings
          git push origin HEAD:feature/v0.3.75-reply-preview-toast-settings
