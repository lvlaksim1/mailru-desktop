name: Audit access-token transport

on:
  push:
    branches:
      - research/mail-apk-15.107.0.148045
    paths:
      - 'research/apk-15.107.0.148045/tools/audit_access_token_transport.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          fetch-depth: 1
      - run: python3 research/apk-15.107.0.148045/tools/audit_access_token_transport.py
      - run: |
          git config user.name "mailru-apk-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/apk-15.107.0.148045/ACCESS_TOKEN_TRANSPORT_AUDIT.md research/apk-15.107.0.148045/ACCESS_TOKEN_TRANSPORT_AUDIT.json
          git commit -m "research: audit actual access_token transport"
          git pull --rebase origin research/mail-apk-15.107.0.148045
          git push origin HEAD:research/mail-apk-15.107.0.148045
