name: Refresh v0.3.79 UI registry
on:
  push:
    branches: [fix/v0.3.79-initial-typing-format]
    paths: [.github/workflows/regen-v0379.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.79-initial-typing-format
      - name: Regenerate and check UI inventory
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit checked inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: update registry for compose typing fix'
          git pull --rebase origin fix/v0.3.79-initial-typing-format
          git push origin HEAD:fix/v0.3.79-initial-typing-format
