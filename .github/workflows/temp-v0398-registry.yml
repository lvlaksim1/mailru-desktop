name: Temporary UI Registry Update v0398
on:
  push:
    branches: [feature/webview2-auth-recovery-v0398]
    paths:
      - .github/workflows/temp-v0398-registry.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/webview2-auth-recovery-v0398
      - name: Rebuild and verify generated UI registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: update window and element registry after v0.3.98 changes"
          sleep 5
          git pull --rebase origin feature/webview2-auth-recovery-v0398
          git push origin HEAD:feature/webview2-auth-recovery-v0398
