name: Regenerate UI registry for standalone template editor
on:
  push:
    branches: [refactor/template-editor-window-v0357-20261013]
    paths: [.github/workflows/regen-template-editor-registry-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/template-editor-window-v0357-20261013
      - name: Rebuild canonical UI register
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish registry in working branch
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate registry for separate template editor"
          git pull --rebase origin refactor/template-editor-window-v0357-20261013
          git push origin HEAD:refactor/template-editor-window-v0357-20261013
