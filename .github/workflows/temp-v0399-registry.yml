name: Temporary UI Registry Update v0399
on:
  push:
    branches: [feature/excel-mailing-controls-v0399]
    paths:
      - .github/workflows/temp-v0399-registry.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/excel-mailing-controls-v0399
      - name: Regenerate UI registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit regenerated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate registry for Excel mailing v0.3.99"
          sleep 5
          git pull --rebase origin feature/excel-mailing-controls-v0399
          git push origin HEAD:feature/excel-mailing-controls-v0399
