name: Original APK PushMe static bytecode audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/research/pushme_dex_static_audit.py'
      - '.github/workflows/pushme-dex-static-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: main-src
      - uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          path: apk-original
          sparse-checkout: |
            research/apk-15.107.0.148045/package/parts
            research/apk-15.107.0.148045/package/SHA256SUMS.txt
          sparse-checkout-cone-mode: false
      - name: Install local bytecode parser
        run: python -m pip install --disable-pip-version-check androguard==4.1.3
      - name: Disassemble original verified APK without server requests
        run: |
          python main-src/tools/research/pushme_dex_static_audit.py \
            apk-original/research/apk-15.107.0.148045/package/parts \
            main-src/docs/research/original-apk-pushme-unsubscribe-dex-2026-10-09.md
      - name: Save bytecode evidence
        shell: bash
        working-directory: main-src
        run: |
          set -euo pipefail
          git config user.name "mailru-apk-auditor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/original-apk-pushme-unsubscribe-dex-2026-10-09.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: statically recover original APK PushMe unsubscribe method DEX"
          sleep 5
          git pull --rebase origin main
          git push origin HEAD:main
