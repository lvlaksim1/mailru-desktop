name: Temporary UI registry regeneration v0397
on:
  push:
    branches: [feature/diagnostics-v0397]
    paths:
      - .github/workflows/temp-v0397-ui-registry.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diagnostics-v0397
          fetch-depth: 1
      - name: Regenerate and verify
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: update diagnostics registry v0.3.97"
          sleep 5
          git pull --rebase origin feature/diagnostics-v0397
          git push origin HEAD:feature/diagnostics-v0397
