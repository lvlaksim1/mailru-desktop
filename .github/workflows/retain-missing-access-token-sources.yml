name: Retain missing access-token sources

on:
  push:
    branches:
      - research/mail-apk-15.107.0.148045
    paths:
      - '.github/workflows/retain-missing-access-token-sources.yml'

permissions:
  contents: write

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          fetch-depth: 1
      - name: Reassemble package
        run: |
          ROOT=research/apk-15.107.0.148045
          cat "$ROOT"/package/parts/Mail_ru_15.107.0.148045_APKs.zip.part-* > /tmp/bundle.zip
          unzip -q /tmp/bundle.zip -d /tmp/bundle
      - name: Get JADX
        run: |
          sleep 5
          curl --fail --location --retry 2 --retry-delay 5             'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip' | sha256sum -c -
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
      - name: Decompile once
        run: |
          /tmp/jadx/bin/jadx -r -j 4 -d /tmp/full /tmp/bundle/Mail-15.107.0.148045.apk >/tmp/jadx.log 2>&1 || true
          test -d /tmp/full/sources
      - name: Retain selected sources
        run: |
          ROOT=research/apk-15.107.0.148045
          for rel in             ru/mail/addressbook/backup/server/UploadContactsToServerCommand.java             ru/mail/logic/auth/GetAuthCodeByAccessTokenCommand.java             ru/mail/logic/auth/ChangeAuthTypeCommand.java             ru/mail/data/cmd/BoundAccsListCmd.java             ru/mail/portal/kit/auth/PortalAuthProvider.java             ru/mail/data/cmd/server/calls/CallsBaseGetRequest.java             ru/mail/data/cmd/server/calls/CallsAuthProviderImpl.java             ru/mail/data/cmd/server/calls/CallsBaseAuthStrategy.java
          do
            src="/tmp/full/sources/$rel"
            if [ -f "$src" ]; then
              dst="$ROOT/decompiled/extra/$rel"
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
            else
              echo "MISSING $rel" >> "$ROOT/findings/retain-missing-source.log"
            fi
          done
      - name: Commit
        run: |
          git config user.name "mailru-apk-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/apk-15.107.0.148045/decompiled/extra research/apk-15.107.0.148045/findings/retain-missing-source.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: retain missing same-token source classes"
          git pull --rebase origin research/mail-apk-15.107.0.148045
          git push origin HEAD:research/mail-apk-15.107.0.148045
