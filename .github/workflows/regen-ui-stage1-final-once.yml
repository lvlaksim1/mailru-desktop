name: One-time UI registry refresh for v0.3.63
on:
  push:
    branches: [fix/restore-central-splitter-v0360-v0.3.63]
    paths: [.github/workflows/regen-ui-stage1-final-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-central-splitter-v0360-v0.3.63
      - name: Regenerate and check
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit registry
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate registry after restoring central splitter baseline"
          git pull --rebase origin fix/restore-central-splitter-v0360-v0.3.63
          git push origin HEAD:fix/restore-central-splitter-v0360-v0.3.63
