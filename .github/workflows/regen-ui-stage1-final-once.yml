name: One-time UI registry refresh for reply editor
on:
  push:
    branches: [feature/reply-composition-attachments-v0.3.58]
    paths: [.github/workflows/regen-ui-stage1-final-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reply-composition-attachments-v0.3.58
      - name: Regenerate and check
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit registry
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate catalog after reply and attachment changes"
          git pull --rebase origin feature/reply-composition-attachments-v0.3.58
          git push origin HEAD:feature/reply-composition-attachments-v0.3.58
