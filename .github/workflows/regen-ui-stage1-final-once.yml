name: Regenerate UI registry after canonical row refactor
on:
  push:
    branches: [refactor/mail-list-single-template-v0.3.60]
    paths: [.github/workflows/regen-ui-stage1-final-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mail-list-single-template-v0.3.60
      - name: Regenerate and check
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit registry
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh registry for v0.3.60"
          git pull --rebase origin refactor/mail-list-single-template-v0.3.60
          git push origin HEAD:refactor/mail-list-single-template-v0.3.60
