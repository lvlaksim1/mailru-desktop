name: One-time UI registry refresh for v0.3.62
on:
  push:
    branches: [fix/compose-spacing-splitter-avatars-v0.3.62]
    paths: [.github/workflows/regen-ui-stage1-final-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compose-spacing-splitter-avatars-v0.3.62
      - name: Regenerate and check
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit registry
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh UI registry after splitter and editor changes"
          git pull --rebase origin fix/compose-spacing-splitter-avatars-v0.3.62
          git push origin HEAD:fix/compose-spacing-splitter-avatars-v0.3.62
