name: v0.3.0 live mailbox check

on:
  push:
    branches:
      - feature/v0.3.0-modern-ui

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAILRU_TEST_LOGIN: ${{ secrets.MAILRU_TEST_LOGIN }}
      MAILRU_TEST_PASSWORD: ${{ secrets.MAILRU_TEST_PASSWORD }}
      MAILRU_PROBE_SCOPE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify test credentials
        shell: bash
        run: |
          test -n "$MAILRU_TEST_LOGIN"
          test -n "$MAILRU_TEST_PASSWORD"
      - name: Run mailbox and feature checks
        shell: bash
        run: dotnet run --project tools/AccessTokenFeatureProbe/AccessTokenFeatureProbe.csproj -c Release
