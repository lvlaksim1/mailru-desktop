name: Temporary v0.3.26 runtime-window registry regeneration

on:
  push:
    branches:
      - fix/v0326-runtime-windows-in-ui-registry
    paths:
      - .github/workflows/refresh-runtime-registry-v0326.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0326-runtime-windows-in-ui-registry
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild runtime window and element registry
        run: python tools/ui_registry.py --write
      - name: Commit registry to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: include runtime compose and contacts windows in UI registry"
            git push origin HEAD:fix/v0326-runtime-windows-in-ui-registry
          fi
