name: Issue 166 Trial Update

on:
  push:
    branches:
      - fix/issue-166-stale-folder-after-account-removal
    paths:
      - src/**
      - tests/**
      - installer/**
      - tools/**
      - .github/workflows/issue-166-trial-update.yml

permissions:
  contents: read

concurrency:
  group: issue-166-trial-build
  cancel-in-progress: true

jobs:
  trial-update:
    if: github.repository == 'lvlaksim1/mailru-desktop'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Autonomous regression tests
        run: dotnet run --project tests/InteractionLogicSmoke/InteractionLogicSmoke.csproj -c Release
      - name: Real WPF component smoke tests
        run: dotnet run --project tests/WindowsUiSmoke/WindowsUiSmoke.csproj -c Release
      - name: Check element registry
        run: python tools/ui_registry.py --check

      - name: Publish trial program version 0.3.71
        shell: pwsh
        run: |
          dotnet publish src/MailRuDesktop.App/MailRuDesktop.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:Version=0.3.71 -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/MailRuDesktop.UpdateAgent/MailRuDesktop.UpdateAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/UpdateAgent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build trial update without publishing Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc installer/update.iss "/DAppVersion=0.3.71" "/DPublishDir=$pwd\publish" "/DOutputDir=$pwd\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item 'dist/MailRuDesktop_Update_v0.3.71.exe' 'MailRuDesktop_Update_ISSUE166_TRIAL_v0.3.71.exe'
          if (-not (Test-Path 'dist/MailRuDesktop_Update_ISSUE166_TRIAL_v0.3.71.exe')) { throw 'Trial updater not found' }

      - name: Upload trial package (not a Release)
        uses: actions/upload-artifact@v4
        with:
          name: MailRuDesktop_Issue166_TRIAL_Update_v0.3.71
          path: dist/MailRuDesktop_Update_ISSUE166_TRIAL_v0.3.71.exe
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
