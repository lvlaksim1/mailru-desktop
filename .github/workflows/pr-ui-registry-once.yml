name: Regenerate UI registry for PR 245 (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/pr-ui-registry-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/rich-mail-window-consistency-v03108'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Generate and verify catalog
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit only generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mailru-ui-registry"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: regenerate catalog after rich compose changes"
          git push origin HEAD:refs/heads/fix/rich-mail-window-consistency-v03108
