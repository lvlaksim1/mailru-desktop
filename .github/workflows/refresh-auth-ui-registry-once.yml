name: One-time v0.3.100 UI registry refresh
on:
  push:
    branches: [feature/auth-status-recovery-v03100]
    paths:
      - '.github/workflows/refresh-auth-ui-registry-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auth-status-recovery-v03100
      - name: Regenerate and verify UI catalog
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh v0.3.100 window/control catalog"
          git pull --rebase origin feature/auth-status-recovery-v03100
          git push origin HEAD:feature/auth-status-recovery-v03100
