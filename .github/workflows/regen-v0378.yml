name: Refresh v0.3.78 UI registry
on:
  push:
    branches: [feature/v0.3.78-compose-greeting-settings-indent]
    paths: [.github/workflows/regen-v0378.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.78-compose-greeting-settings-indent
      - name: Regenerate and validate inventory
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit checked registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: update registry for settings padding v0.3.78'
          git pull --rebase origin feature/v0.3.78-compose-greeting-settings-indent
          git push origin HEAD:feature/v0.3.78-compose-greeting-settings-indent
