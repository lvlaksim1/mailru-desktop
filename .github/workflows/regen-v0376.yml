name: Regenerate v0.3.76 UI registry
on:
  push:
    branches: [feature/v0.3.76-counterparties-refresh]
    paths: [.github/workflows/regen-v0376.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.76-counterparties-refresh
      - name: Generate registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: regenerate registry for v0.3.76'
          git pull --rebase origin feature/v0.3.76-counterparties-refresh
          git push origin HEAD:feature/v0.3.76-counterparties-refresh
