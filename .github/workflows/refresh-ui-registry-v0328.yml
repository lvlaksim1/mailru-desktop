name: Temporary v0.3.28 UI registry generation
on:
  push:
    branches:
      - feature/v0.3.28-owner-gui-fixes
    paths:
      - .github/workflows/refresh-ui-registry-v0328.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.28-owner-gui-fixes
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ui_registry.py --write
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate v0.3.28 window and element registry"
            git push origin HEAD:feature/v0.3.28-owner-gui-fixes
          fi
# repeat after final UI adjustments
