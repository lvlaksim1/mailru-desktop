name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/MailRuDesktop.App/MailRuDesktop.App.csproj
      - name: Build
        run: dotnet build src/MailRuDesktop.App/MailRuDesktop.App.csproj -c Release --no-restore

      - name: Enforce AJ-only Mail.ru hosts
        shell: pwsh
        run: |
          $violations = Get-ChildItem src -Recurse -File -Include *.cs,*.xaml |
            Select-String -Pattern 'https://[A-Za-z0-9.-]*mail\.ru' |
            Where-Object { $_.Line -notmatch 'https://aj-https\.mail\.ru' }
          if ($violations) {
            $violations | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Non-AJ Mail.ru host found in runtime source.'
          }
