name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/MailRuDesktop.App/MailRuDesktop.App.csproj
      - name: Build
        run: dotnet build src/MailRuDesktop.App/MailRuDesktop.App.csproj -c Release --no-restore

      - name: Interaction regression tests (offline)
        run: dotnet run --project tests/InteractionLogicSmoke/InteractionLogicSmoke.csproj -c Release

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = 'src\MailRuDesktop.App\bin\Release\net8.0-windows\MailRuDesktop.App.exe'
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if ($process.HasExited) {
            throw "Application exited during launch smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Enforce endpoint-registry Mail.ru hosts
        shell: pwsh
        run: |
          $catalogPath = 'src/MailRuDesktop.Protocol/MailRuProtocol.cs'
          $catalog = Get-Content $catalogPath -Raw
          $approved = [regex]::Matches($catalog, 'new\("[^"]+",\s*"[^"]+",\s*"([A-Za-z0-9.-]+)"') |
            ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } |
            Sort-Object -Unique

          if (-not $approved) { throw 'Endpoint catalog contains no Mail.ru hosts.' }

          $violations = @()
          Get-ChildItem src -Recurse -File -Include *.cs,*.xaml | ForEach-Object {
            $path = $_.FullName
            $lineNumber = 0
            Get-Content $path | ForEach-Object {
              $lineNumber++
              $line = $_
              foreach ($match in [regex]::Matches($line, 'https://([A-Za-z0-9.-]*(?:mail\.ru|attachmail\.ru))')) {
                $mailHost = $match.Groups[1].Value.ToLowerInvariant()
                if ($approved -notcontains $mailHost) {
                  $violations += ('{0}:{1}: {2}' -f $path, $lineNumber, $line.Trim())
                }
              }
            }
          }

          if ($violations.Count -gt 0) {
            $violations | ForEach-Object { Write-Host $_ }
            throw 'Mail.ru host is used outside the endpoint registry.'
          }