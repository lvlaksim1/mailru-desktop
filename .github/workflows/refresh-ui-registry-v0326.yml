name: Temporary v0.3.26 UI registry regeneration

on:
  push:
    branches:
      - feature/v0.3.26-owner-ux-nine-fixes
    paths:
      - .github/workflows/refresh-ui-registry-v0326.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.26-owner-ux-nine-fixes
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact source-derived interface registry
        run: python tools/ui_registry.py --write
      - name: Publish registry only to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "v0.3.26: regenerate complete UI registry from sources"
            git push origin HEAD:feature/v0.3.26-owner-ux-nine-fixes
          fi
