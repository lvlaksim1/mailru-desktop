name: One-time v0.3.101 UI catalog refresh
on:
  push:
    branches: [feature/settings-portable-backup-v03101]
    paths:
      - '.github/workflows/refresh-portable-ui-registry-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settings-portable-backup-v03101
      - name: Regenerate and verify catalog
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: update registry for portable settings"
          git pull --rebase origin feature/settings-portable-backup-v03101
          git push origin HEAD:feature/settings-portable-backup-v03101
