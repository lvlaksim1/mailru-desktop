name: Final template editor UI registry synchronization
on:
  push:
    branches: [refactor/template-editor-window-v0357-20261013]
    paths: [.github/workflows/regen-template-editor-final-v2.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/template-editor-window-v0357-20261013
      - name: Rebuild and verify registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish generated file
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: synchronize registry after shared rich-formatting changes"
          git pull --rebase origin refactor/template-editor-window-v0357-20261013
          git push origin HEAD:refactor/template-editor-window-v0357-20261013
