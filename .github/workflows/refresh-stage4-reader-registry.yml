name: Refresh stage 4 reader header registry
on:
  push:
    branches: [refactor/stage4-reader-header-component]
    paths:
      - '.github/workflows/refresh-stage4-reader-registry.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage4-reader-header-component
          fetch-depth: 1
      - name: Generate verified UI registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: catalog independent reader header component'
          sleep 5
          git pull --rebase origin refactor/stage4-reader-header-component
          git push origin HEAD:refactor/stage4-reader-header-component
