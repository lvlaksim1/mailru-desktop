name: UI Registry Snapshot

on:
  push:
    branches:
      - feature/v0.3.25-ui-registry-font-and-mail-targets

permissions:
  contents: write

concurrency:
  group: ui-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Generate reproducible window and element inventory
        run: python tools/ui_registry.py --write
      - name: Commit inventory snapshot to development branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate all-window and all-element UI inventory"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
