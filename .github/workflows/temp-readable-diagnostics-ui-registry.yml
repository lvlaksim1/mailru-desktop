name: Temporary readable diagnostics registry refresh
on:
  push:
    branches: [fix/human-readable-diagnostics-v0395]
    paths:
      - .github/workflows/temp-readable-diagnostics-ui-registry.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/human-readable-diagnostics-v0395
          fetch-depth: 1
      - name: Generate checked registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated registry only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: regenerate registry for readable diagnostics'
          sleep 5
          git pull --rebase origin fix/human-readable-diagnostics-v0395
          git push origin HEAD:fix/human-readable-diagnostics-v0395
