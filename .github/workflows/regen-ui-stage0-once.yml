name: Regenerate UI registry after stage 0 pin update
on:
  push:
    branches: [refactor/stage0-restore-mail-pin-20261013]
    paths: [.github/workflows/regen-ui-stage0-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage0-restore-mail-pin-20261013
      - name: Rebuild canonical UI register
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated register
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh registry after restoring pin column"
          git pull --rebase origin refactor/stage0-restore-mail-pin-20261013
          git push origin HEAD:refactor/stage0-restore-mail-pin-20261013
