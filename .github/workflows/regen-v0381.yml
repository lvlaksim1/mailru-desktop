name: Regenerate v0.3.81 UI registry
on:
  push:
    branches: [fix/v0.3.81-active-excel-row-resizable-senders]
    paths: [.github/workflows/regen-v0381.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.3.81-active-excel-row-resizable-senders
      - name: Build UI inventory
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish inventory to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: refresh Excel mailing splitter registry v0.3.81'
          git pull --rebase origin fix/v0.3.81-active-excel-row-resizable-senders
          git push origin HEAD:fix/v0.3.81-active-excel-row-resizable-senders
