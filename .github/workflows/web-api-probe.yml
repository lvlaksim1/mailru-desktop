name: Web API probe

on:
  push:
    branches:
      - research/web-api-token
    paths:
      - "tools/WebApiProbe/**"
      - "tools/WebApiLegacyProbe/**"
      - "tools/WebApiActTokenProbe/**"
      - "tools/WebCookieProbe/**"
      - ".github/workflows/web-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAILRU_TEST_LOGIN: ${{ secrets.MAILRU_TEST_LOGIN }}
      MAILRU_TEST_PASSWORD: ${{ secrets.MAILRU_TEST_PASSWORD }}
      MAILRU_TEST_WEB_COOKIES: ${{ secrets.MAILRU_TEST_WEB_COOKIES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify credential secrets exist
        shell: bash
        run: |
          test -n "$MAILRU_TEST_LOGIN"
          test -n "$MAILRU_TEST_PASSWORD"

      - name: Probe authenticated web cookies
        continue-on-error: true
        run: dotnet run --project tools/WebCookieProbe/WebCookieProbe.csproj -c Release

      - name: Safety pause before Hackus flow
        if: always()
        run: sleep 10

      - name: Probe Hackus web session
        if: always()
        continue-on-error: true
        run: dotnet run --project tools/WebApiProbe/WebApiProbe.csproj -c Release

      - name: Safety pause before VBA flow
        if: always()
        run: sleep 10

      - name: Probe VBA web auth and SDC flow
        if: always()
        continue-on-error: true
        run: dotnet run --project tools/WebApiLegacyProbe/WebApiLegacyProbe.csproj -c Release

      - name: Safety pause before act-token flow
        if: always()
        run: sleep 10

      - name: Probe act-token web auth flow
        if: always()
        continue-on-error: true
        run: dotnet run --project tools/WebApiActTokenProbe/WebApiActTokenProbe.csproj -c Release
