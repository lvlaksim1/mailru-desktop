name: Web API probe

on:
  push:
    branches:
      - research/web-api-token
    paths:
      - "tools/WebApiProbe/**"
      - ".github/workflows/web-api-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAILRU_TEST_LOGIN: ${{ secrets.MAILRU_TEST_LOGIN }}
      MAILRU_TEST_PASSWORD: ${{ secrets.MAILRU_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify secrets exist
        shell: bash
        run: |
          test -n "$MAILRU_TEST_LOGIN"
          test -n "$MAILRU_TEST_PASSWORD"

      - name: Probe Mail.ru web session and read API
        continue-on-error: true
        run: dotnet run --project tools/WebApiProbe/WebApiProbe.csproj -c Release
