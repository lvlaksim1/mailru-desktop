name: Extract AJ request contracts

on:
  push:
    branches:
      - research/mail-apk-15.107.0.148045
    paths:
      - '.github/workflows/extract-aj-contracts.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          fetch-depth: 1

      - name: Build request contract inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("research/apk-15.107.0.148045")
          src = root / "decompiled" / "packages"
          route_map = (root / "APK_ROUTE_MAP.md").read_text(encoding="utf-8")

          routes = []
          for line in route_map.splitlines():
              m = re.match(r'\\|\\s*(GET|POST|PUT|DELETE|PATCH)\\s*\\|\\s*[^/]*(/[^ ]*)[^|]*\\|\\s*[^A-Za-z0-9_]*([A-Za-z0-9_]+)[^|]*\\|', line)
              if m:
                  routes.append(m.groups())

          class_files = {}
          for p in src.rglob("*.java"):
              class_files.setdefault(p.stem, []).append(p)

          def choose(name):
              arr = class_files.get(name, [])
              if not arr:
                  return None
              arr = sorted(arr, key=lambda p: (0 if "ru/mail/data/cmd/server" in str(p) else 1, len(str(p))))
              return arr[0]

          def own_params(text):
              found = []
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if "@Param(" not in line:
                      continue
                  ann = line.strip()
                  field = ""
                  for j in range(i+1, min(i+8, len(lines))):
                      s = lines[j].strip()
                      if not s or s.startswith("@"):
                          continue
                      if re.search(r'\\b(private|protected|public)\\b.*;', s):
                          field = s
                          break
                  name = None
                  mm = re.search(r'name\\s*=\\s*"([^"]+)"', ann)
                  if mm:
                      name = mm.group(1)
                  method = None
                  mm = re.search(r'method\\s*=\\s*HttpMethod\\.([A-Z]+)', ann)
                  if mm:
                      method = mm.group(1)
                  getter = None
                  mm = re.search(r'getterName\\s*=\\s*"([^"]+)"', ann)
                  if mm:
                      getter = mm.group(1)
                  found.append((name, method, getter, ann, field))
              return found

          def nested_param_bases(text):
              out = []
              for m in re.finditer(r'(?:public\\s+)?(?:static\\s+)?class\\s+Params\\s+extends\\s+([A-Za-z0-9_$.]+)', text):
                  base = m.group(1).split(".")[0]
                  if base != "ServerCommandBaseParams":
                      out.append(base)
              return out

          def class_base(text, cls):
              m = re.search(r'class\\s+' + re.escape(cls) + r'(?:<[^>{}]*>)?\\s+extends\\s+([A-Za-z0-9_$.]+)', text)
              if not m:
                  return None
              return m.group(1).split(".")[0]

          def collect(cls, seen=None):
              seen = set() if seen is None else seen
              if cls in seen:
                  return [], [], []
              seen.add(cls)
              p = choose(cls)
              if not p:
                  return [], [], []
              text = p.read_text(encoding="utf-8", errors="replace")
              params = [(str(p.relative_to(root)), *x) for x in own_params(text)]
              keys = sorted(set(m.group(2) for m in re.finditer(
                  r'\\.(getJSONObject|getJSONArray|getString|getInt|getLong|getBoolean|optString|optJSONArray|optJSONObject|optInt|optLong|optBoolean|has)\\("([^"]+)"\\)', text)))
              sources = [str(p.relative_to(root))]
              bases = []
              cb = class_base(text, cls)
              if cb and cb != "Object":
                  bases.append(cb)
              bases += nested_param_bases(text)
              for b in dict.fromkeys(bases):
                  pp, kk, ss = collect(b, seen)
                  params += pp
                  keys += kk
                  sources += ss
              uniqp=[]; seenp=set()
              for x in params:
                  k=tuple(x)
                  if k not in seenp:
                      seenp.add(k); uniqp.append(x)
              return uniqp, sorted(set(keys)), list(dict.fromkeys(sources))

          out = []
          out.append("# Автоматически извлеченные договоры AJ из APK")
          out.append("")
          out.append("Источник: декомпилированный ru.mail.mailapp 15.107.0.148045.")
          out.append("")
          out.append("Машинная инвентаризация аннотаций @Param, наследуемых классов параметров и ключей JSON, читаемых из ответа.")
          out.append("")
          for method, route, cls in routes:
              params, keys, sources = collect(cls)
              out.append("## " + method + " " + route)
              out.append("")
              out.append("Класс: " + cls)
              out.append("")
              if params:
                  out.append("| имя | размещение | получатель | поле | источник |")
                  out.append("|---|---|---|---|---|")
                  for source, name, pmeth, getter, ann, field in params:
                      shown = name or "(имя из поля/получателя)"
                      place = pmeth or "(по умолчанию)"
                      get = getter or ""
                      fld = field.replace("|","/")
                      out.append("| " + shown + " | " + place + " | " + get + " | " + fld + " | " + source + " |")
                  out.append("")
              else:
                  out.append("Явных @Param в доступной цепочке классов не найдено.")
                  out.append("")
              if keys:
                  out.append("Ключи JSON ответа: " + ", ".join(keys))
                  out.append("")
              out.append("Просмотренные исходники: " + ", ".join(sources))
              out.append("")

          (root / "APK_REQUEST_CONTRACTS.md").write_text("\\n".join(out) + "\\n", encoding="utf-8")
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "mailru-apk-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/apk-15.107.0.148045/APK_REQUEST_CONTRACTS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: extract AJ request contracts from APK"
          git push origin HEAD:research/mail-apk-15.107.0.148045
