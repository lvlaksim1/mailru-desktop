name: Decompile Mail.ru APK network layer\n# extraction syntax fixed 2026-10-06

on:
  push:
    branches:
      - research/mail-apk-15.107.0.148045
    paths:
      - '.github/workflows/decompile-mail-apk.yml'

permissions:
  contents: write

jobs:
  decompile-network:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          fetch-depth: 1

      - name: Reassemble package
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/apk-15.107.0.148045
          mkdir -p /tmp/mail-package
          cat "$ROOT"/package/parts/Mail_ru_15.107.0.148045_APKs.zip.part-* > /tmp/Mail_ru_15.107.0.148045_APKs.zip
          EXPECTED=$(head -n 1 "$ROOT/package/SHA256SUMS.txt" | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/Mail_ru_15.107.0.148045_APKs.zip | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"
          unzip -q /tmp/Mail_ru_15.107.0.148045_APKs.zip -d /tmp/mail-package
          test -f /tmp/mail-package/Mail-15.107.0.148045.apk

      - name: Download JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' \
            -o /tmp/jadx.zip
          echo '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  /tmp/jadx.zip' | sha256sum -c -
          mkdir -p /tmp/jadx-bin
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          chmod +x /tmp/jadx-bin/bin/jadx

      - name: Decompile Java/Kotlin code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jadx-out
          /tmp/jadx-bin/bin/jadx \
            -r \
            -j 4 \
            -d /tmp/jadx-out \
            /tmp/mail-package/Mail-15.107.0.148045.apk \
            > /tmp/jadx.log 2>&1 || true
          test -d /tmp/jadx-out/sources
          {
            echo '# JADX log tail'
            tail -n 200 /tmp/jadx.log
          } > research/apk-15.107.0.148045/findings/jadx-log-tail.txt

      - name: Extract network-related source corpus
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/apk-15.107.0.148045
          SRC=/tmp/jadx-out/sources
          DEST="$ROOT/decompiled"
          rm -rf "$DEST"
          mkdir -p "$DEST/relevant" "$DEST/packages"

          if [ -d "$SRC/ru/mail/serverapi" ]; then
            mkdir -p "$DEST/packages/ru/mail"
            cp -a "$SRC/ru/mail/serverapi" "$DEST/packages/ru/mail/"
          fi
          if [ -d "$SRC/ru/mail/auth/request" ]; then
            mkdir -p "$DEST/packages/ru/mail/auth"
            cp -a "$SRC/ru/mail/auth/request" "$DEST/packages/ru/mail/auth/"
          fi
          if [ -d "$SRC/ru/mail/auth/webview" ]; then
            mkdir -p "$DEST/packages/ru/mail/auth"
            cp -a "$SRC/ru/mail/auth/webview" "$DEST/packages/ru/mail/auth/"
          fi
          if [ -d "$SRC/ru/mail/mailbox/cmd" ]; then
            mkdir -p "$DEST/packages/ru/mail/mailbox"
            cp -a "$SRC/ru/mail/mailbox/cmd" "$DEST/packages/ru/mail/mailbox/"
          fi

          # Главный набор команд мобильного почтового API.
          if [ -d "$SRC/ru/mail/data/cmd/server" ]; then
            mkdir -p "$DEST/packages/ru/mail/data/cmd"
            cp -a "$SRC/ru/mail/data/cmd/server" "$DEST/packages/ru/mail/data/cmd/"
          fi
          if [ -d "$SRC/ru/mail/data/api" ]; then
            mkdir -p "$DEST/packages/ru/mail/data"
            cp -a "$SRC/ru/mail/data/api" "$DEST/packages/ru/mail/data/"
          fi
          if [ -d "$SRC/ru/mail/filter/data" ]; then
            mkdir -p "$DEST/packages/ru/mail/filter"
            cp -a "$SRC/ru/mail/filter/data" "$DEST/packages/ru/mail/filter/"
          fi
          if [ -d "$SRC/ru/mail/customtags/impl/api" ]; then
            mkdir -p "$DEST/packages/ru/mail/customtags/impl"
            cp -a "$SRC/ru/mail/customtags/impl/api" "$DEST/packages/ru/mail/customtags/impl/"
          fi

          PAT='aj-https\.mail\.ru|alt-aj-https\.mail\.ru|mail_api_default_host|new_mail_api_default_host|auth_default_host|/cgi-bin/auth|messages/message|messages/marks|messages/move|messages/send|messages/schedule|messages/attaches/add|m/threads/status/smart|threads/status|messages/search|access_token|af\.attachmail\.ru|MAIL_SECOND_STEP_REQUIRED|MailSecondStep|LudwigToken|mLudwig|\btsa\b|captcha|recaptcha'
          grep -RIlE "$PAT" "$SRC" > "$ROOT/findings/jadx-matched-files.txt" || true

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#$SRC/}"
            mkdir -p "$DEST/relevant/$(dirname "$rel")"
            cp "$f" "$DEST/relevant/$rel"
          done < "$ROOT/findings/jadx-matched-files.txt"

          grep -RInE -C 4 "$PAT" "$SRC" > "$ROOT/findings/jadx-api-context.txt" || true

          grep -RInE -C 3 '(@GET|@POST|@PUT|@DELETE|Request\.Builder|HttpUrl|addQueryParameter|addFormDataPart|FormBody|MultipartBody|ServerApi|ApiRequest)'             "$DEST/packages/ru/mail/serverapi" > "$ROOT/findings/serverapi-http-context.txt" || true

          grep -RhoE '"[^"]*(/api/v[0-9]+/|/cgi-bin/auth|messages/|threads/|folders/|attaches/)[^"]*"' "$SRC/ru/mail" 2>/dev/null | sort -u > "$ROOT/findings/decompiled-endpoint-strings.txt" || true

          {
            echo '# Декомпилированный сетевой слой'
            echo
            echo 'JADX: 1.5.6'
            echo "Совпавших исходных файлов: $(wc -l < "$ROOT/findings/jadx-matched-files.txt" 2>/dev/null || echo 0)"
            echo "Файлов ru/mail/serverapi: $(find "$DEST/packages/ru/mail/serverapi" -type f 2>/dev/null | wc -l)"
            echo "Размер сохранённого сетевого слоя: $(du -sh "$DEST" | awk '{print $1}')"
            echo
            echo 'Каталог packages/ содержит сетевые пакеты Mail.ru целиком; relevant/ — файлы с прямыми совпадениями по AJ/почтовым маршрутам.'
          } > "$DEST/README.md"

      - name: Commit decompiled network corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mailru-apk-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/apk-15.107.0.148045/decompiled research/apk-15.107.0.148045/findings
          git commit -m "research: decompile Mail.ru APK network layer"
          git pull --rebase origin research/mail-apk-15.107.0.148045
          git push origin HEAD:research/mail-apk-15.107.0.148045
