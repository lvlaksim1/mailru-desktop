name: Refresh v0.3.80 UI registry
on:
  push:
    branches: [feature/v0.3.80-excel-mailing-preparation]
    paths: [.github/workflows/regen-v0380.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.3.80-excel-mailing-preparation
      - name: Generate and verify UI inventory
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Save inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: update window registry for Excel mailing preview'
          git pull --rebase origin feature/v0.3.80-excel-mailing-preparation
          git push origin HEAD:feature/v0.3.80-excel-mailing-preparation
