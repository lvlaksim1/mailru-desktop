name: Rebuild UI registry for persistent settings
on:
  push:
    branches: [refactor/stage1-settings-composer-markdown-20261013]
    paths: [.github/workflows/regen-ui-stage1-final.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stage1-settings-composer-markdown-20261013
      - name: Regenerate and validate registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit changed registry
        run: |
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh registry for persisted settings panels"
          git pull --rebase origin refactor/stage1-settings-composer-markdown-20261013
          git push origin HEAD:refactor/stage1-settings-composer-markdown-20261013
