name: Refresh checked UI registry
# v3: include automatic notifications switch and connection-state label
on:
  push:
    branches: [main, feature/replay-suppression-toggle-v0352]
    paths:
      - '.github/workflows/ui-registry-refresh.yml'
      - 'src/MailRuDesktop.App/**/*.xaml'
      - 'src/MailRuDesktop.App/**/*.cs'
      - 'tools/ui_registry.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Rebuild verified window/control registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Commit generated registry only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: register native push diagnostics window and control elements'
          sleep 5
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
