name: Extract AJ request contracts v2

on:
  push:
    branches:
      - research/mail-apk-15.107.0.148045
    paths:
      - '.github/workflows/extract-aj-contracts-v2.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mail-apk-15.107.0.148045
          fetch-depth: 1

      - name: Build request contract inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("research/apk-15.107.0.148045")
          src = root / "decompiled" / "packages"
          route_map = (root / "APK_ROUTE_MAP.md").read_text(encoding="utf-8")

          routes = []
          for line in route_map.splitlines():
              parts = [x.strip().strip(chr(96)) for x in line.split("|")]
              if len(parts) >= 5 and parts[1] in {"GET","POST","PUT","DELETE","PATCH"} and parts[2].startswith("/"):
                  routes.append((parts[1], parts[2], parts[3]))

          class_files = {}
          for p in src.rglob("*.java"):
              class_files.setdefault(p.stem, []).append(p)

          def choose(name):
              arr = class_files.get(name, [])
              if not arr:
                  return None
              return sorted(arr, key=lambda p: (0 if "ru/mail/data/cmd/server" in str(p) else 1, len(str(p))))[0]

          def own_params(text):
              found = []
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if "@Param(" not in line:
                      continue
                  ann = line.strip()
                  field = ""
                  for j in range(i+1, min(i+8, len(lines))):
                      s = lines[j].strip()
                      if not s or s.startswith("@"):
                          continue
                      if re.search(r'\\b(private|protected|public)\\b.*;', s):
                          field = s
                          break
                  nm = re.search(r'name\\s*=\\s*"([^"]+)"', ann)
                  mm = re.search(r'method\\s*=\\s*HttpMethod\\.([A-Z]+)', ann)
                  gm = re.search(r'getterName\\s*=\\s*"([^"]+)"', ann)
                  found.append((nm.group(1) if nm else "", mm.group(1) if mm else "", gm.group(1) if gm else "", field))
              return found

          def nested_bases(text):
              out = []
              for m in re.finditer(r'class\\s+Params\\s+extends\\s+([A-Za-z0-9_$.]+)', text):
                  out.append(m.group(1).split(".")[0])
              return out

          def class_base(text, cls):
              m = re.search(r'class\\s+' + re.escape(cls) + r'(?:<[^>{}]*>)?\\s+extends\\s+([A-Za-z0-9_$.]+)', text)
              return m.group(1).split(".")[0] if m else ""

          def collect(cls, seen=None):
              seen=set() if seen is None else seen
              if not cls or cls in seen:
                  return [], [], []
              seen.add(cls)
              p=choose(cls)
              if not p:
                  return [], [], []
              text=p.read_text(encoding="utf-8",errors="replace")
              params=[(str(p.relative_to(root)),)+x for x in own_params(text)]
              keys=sorted(set(m.group(2) for m in re.finditer(r'\\.(getJSONObject|getJSONArray|getString|getInt|getLong|getBoolean|optString|optJSONArray|optJSONObject|optInt|optLong|optBoolean|has)\\("([^"]+)"\\)',text)))
              sources=[str(p.relative_to(root))]
              bases=[]
              cb=class_base(text,cls)
              if cb and cb!="Object":
                  bases.append(cb)
              bases.extend(nested_bases(text))
              for b in dict.fromkeys(bases):
                  pp,kk,ss=collect(b,seen)
                  params.extend(pp); keys.extend(kk); sources.extend(ss)
              unique=[]
              used=set()
              for x in params:
                  if x not in used:
                      used.add(x); unique.append(x)
              return unique, sorted(set(keys)), list(dict.fromkeys(sources))

          out=["# Автоматически извлеченные договоры AJ из APK","",
               "Источник: декомпилированный ru.mail.mailapp 15.107.0.148045.","",
               "Инвентаризация аннотаций @Param, наследуемых параметров и ключей JSON ответа.",""]

          for method, route, cls in routes:
              params, keys, sources=collect(cls)
              out += ["## "+method+" "+route,"","Класс: "+cls,""]
              if params:
                  out += ["| имя | размещение | получатель | поле | источник |","|---|---|---|---|---|"]
                  for source,name,pmeth,getter,field in params:
                      out.append("| "+(name or "(не задано)")+" | "+(pmeth or "(по умолчанию)")+" | "+getter+" | "+field.replace("|","/")+" | "+source+" |")
                  out.append("")
              else:
                  out += ["Явных @Param в доступной цепочке классов не найдено.",""]
              if keys:
                  out += ["Ключи JSON ответа: "+", ".join(keys),""]
              out += ["Просмотренные исходники: "+", ".join(sources),""]

          (root/"APK_REQUEST_CONTRACTS.md").write_text("\\n".join(out)+"\\n",encoding="utf-8")
          PY

      - name: Commit report
        shell: bash
        run: |
          git config user.name "mailru-apk-research"
          git config user.email "actions@users.noreply.github.com"
          git add research/apk-15.107.0.148045/APK_REQUEST_CONTRACTS.md
          git commit -m "research: extract AJ request contracts from APK"
          git pull --rebase origin research/mail-apk-15.107.0.148045
          git push origin HEAD:research/mail-apk-15.107.0.148045
