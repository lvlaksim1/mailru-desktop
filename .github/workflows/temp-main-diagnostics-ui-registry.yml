name: Temporary main-window diagnostics registry refresh
on:
  push:
    branches: [feature/main-window-full-diagnostics-v0396]
    paths:
      - .github/workflows/temp-main-diagnostics-ui-registry.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/main-window-full-diagnostics-v0396
          fetch-depth: 1
      - name: Rebuild UI registry
        run: |
          python tools/ui_registry.py --write
          python tools/ui_registry.py --check
      - name: Publish updated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name mailru-ui-registry
          git config user.email actions@users.noreply.github.com
          git add docs/ui-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ui: refresh list-side diagnostics registry"
          sleep 5
          git pull --rebase origin feature/main-window-full-diagnostics-v0396
          git push origin HEAD:feature/main-window-full-diagnostics-v0396
